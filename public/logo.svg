<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="60%" stop-color="#00695C" />
      <stop offset="100%" stop-color="#00897B" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Recycling Emblem (3 Möbius arrows around camera iris + leaf) -->
  <g transform="translate(10, 8)">
    <!-- Hexagonal outer path structure with 3 arrows -->
    <!-- Arrow Segment 1: Top Right to Bottom Right -->
    <path d="M 42 4 L 70 20 C 74 22 76 26 76 30 L 76 54 C 76 58 74 62 70 64 L 56 72" 
          fill="none" stroke="url(#vgGrad)" stroke-width="5.5" stroke-linecap="round" />
    <polygon points="56,66 48,74 58,80" fill="#00695C" />

    <!-- Arrow Segment 2: Bottom to Bottom Left -->
    <path d="M 44 76 L 16 60 C 12 58 10 54 10 50 L 10 32 C 10 28 12 24 16 22 L 28 14" 
          fill="none" stroke="url(#vgGrad)" stroke-width="5.5" stroke-linecap="round" />
    <polygon points="28,8 36,16 26,22" fill="#1B5E20" />

    <!-- Arrow Segment 3: Top traverse and camera enclosure -->
    <path d="M 28 14 L 42 6 C 44 5 48 5 50 6 L 62 13" 
          fill="none" stroke="url(#vgGrad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Camera Aperture Iris Blades in Center (43, 42) -->
    <g transform="translate(43, 42)">
      <!-- Iris Circle rim -->
      <circle cx="0" cy="0" r="18" fill="#112211" stroke="#004D40" stroke-width="1.5"/>
      
      <!-- 6 Aperture blades -->
      <path d="M 0 -16 L 9 -7 L 5 0 Z" fill="#1B5E20" opacity="0.85" />
      <path d="M 9 -7 L 16 2 L 7 4 Z" fill="#00695C" opacity="0.85" />
      <path d="M 16 2 L 8 13 L 2 6 Z" fill="#00796B" opacity="0.85" />
      <path d="M 8 13 L -6 14 L -2 5 Z" fill="#2E7D32" opacity="0.85" />
      <path d="M -6 14 L -15 4 L -6 0 Z" fill="#388E3C" opacity="0.85" />
      <path d="M -15 4 L -4 -12 L 0 -4 Z" fill="#1B5E20" opacity="0.85" />

      <!-- Center Aperture Opening -->
      <circle cx="0" cy="0" r="7" fill="#0A180E" />

      <!-- Botanical Leaf symbol emerging from aperture -->
      <path d="M -2 3 C -4 -1, -2 -5, 3 -5 C 5 -1, 4 3, -2 3 Z" fill="url(#leafGrad)" />
      <path d="M -2 3 L 2 -3" stroke="#1B5E20" stroke-width="0.7" />
    </g>
  </g>

  <!-- Wordmark "VeriGrade S3" -->
  <text x="106" y="52" font-family="'Poppins', 'Inter', sans-serif" font-weight="600" font-size="34" fill="#1B5E20" letter-spacing="-0.5">
    Veri<tspan fill="#00695C">Grade</tspan>
  </text>
  <rect x="290" y="27" width="46" height="28" rx="6" fill="#1B5E20" />
  <text x="313" y="47" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#FAFAF7" text-anchor="middle" letter-spacing="1">
    S3
  </text>

  <!-- Tagline underneath -->
  <text x="108" y="74" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#556B2F" letter-spacing="1.2">
    SEE IT. WEIGH IT. TRUST IT.
  </text>
</svg>
