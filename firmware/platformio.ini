; ==============================================================================
; VERIGRADE S3 — PlatformIO Configuration File
; Target: Espressif ESP32-S3 (8MB Flash, 512KB SRAM, dual-core 240MHz)
; Framework: Arduino + FreeRTOS
; CLAIM MAP: Claims 1, 2, 8, 13, 27, 33 (Hardware Abstraction & OS Layer)
; ==============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Board Configuration: 8MB Flash (Quad/Octal SPI), PSRAM enabled if available
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; Build Optimization Flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DVERIGRADE_FIRMWARE_VERSION=\"1.0.4\"
    -Wall

; Serial Monitor & Upload
monitor_speed = 115200
upload_speed = 921600

; External Library Dependencies
lib_deps =
    bogde/HX711 @ ^0.7.5
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
